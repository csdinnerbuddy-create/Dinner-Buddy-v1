<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --cream: #FAF8F3;
  --ink: #1C1A16;
  --ink-light: #6B6760;
  --ink-faint: #C4C0B8;
  --green: #2A7A5A;
  --green-light: #E8F4EE;
  --green-mid: #4BAF84;
  --border: rgba(28,26,22,0.12);
  --border-strong: rgba(28,26,22,0.22);
  --radius: 12px;
  --radius-sm: 7px;
}
html { background: var(--cream); color: var(--ink); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.6; }
body { max-width: 860px; margin: 0 auto; padding: 0 20px 80px; }

/* HEADER */
header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 18px; border-bottom: 1px solid var(--border); margin-bottom: 36px; }
.logo { font-family: 'Lora', serif; font-size: 18px; font-weight: 500; display: flex; align-items: center; gap: 9px; }
.logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.meta { font-size: 13px; color: var(--ink-light); text-align: right; line-height: 1.4; }

/* SECTION TITLES */
.section-title {
  font-family: 'Lora', serif; font-size: 22px; font-weight: 400;
  margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.section-title em { font-style: italic; color: var(--green); }

/* WEEK STRIP */
.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 44px; }
.day-block { background: white; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 8px; text-align: center; }
.day-block .day-name { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); margin-bottom: 5px; }
.day-block .day-emoji { font-size: 22px; margin-bottom: 4px; }
.day-block .day-meal { font-size: 11px; font-weight: 500; color: var(--ink); line-height: 1.3; }

/* RECIPES */
.recipes-grid { display: flex; flex-direction: column; gap: 24px; margin-bottom: 48px; }
.recipe-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.recipe-header { display: flex; align-items: center; gap: 16px; padding: 18px 20px 16px; border-bottom: 1px solid var(--border); }
.recipe-emoji { font-size: 32px; flex-shrink: 0; }
.recipe-title-block { flex: 1; }
.recipe-name { font-family: 'Lora', serif; font-size: 18px; font-weight: 500; margin-bottom: 5px; }
.recipe-day-badge { font-size: 11px; background: var(--green-light); color: var(--green); padding: 2px 9px; border-radius: 20px; font-weight: 500; }
.recipe-tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.rtag { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #F2F0EB; color: var(--ink-light); }
.recipe-body { display: grid; grid-template-columns: 1fr 1.6fr; gap: 0; }
.recipe-ingredients { padding: 16px 20px; border-right: 1px solid var(--border); }
.recipe-instructions { padding: 16px 20px; }
.col-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); margin-bottom: 10px; }
.ing-list { list-style: none; }
.ing-list li { font-size: 13px; color: var(--ink); padding: 3px 0; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
.ing-list li:last-child { border-bottom: none; }
.ing-list li::before { content: "·"; color: var(--green); flex-shrink: 0; }
.inst-list { list-style: none; counter-reset: step; }
.inst-list li { font-size: 13px; color: var(--ink); padding: 4px 0 4px 28px; position: relative; border-bottom: 1px solid var(--border); counter-increment: step; }
.inst-list li:last-child { border-bottom: none; }
.inst-list li::before { content: counter(step); position: absolute; left: 0; top: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--green-light); color: var(--green); font-size: 10px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
.prep-note { font-size: 12px; color: var(--ink-light); font-style: italic; padding: 10px 20px; background: var(--cream); border-top: 1px solid var(--border); }

/* GROCERY LIST */
.grocery-section { margin-bottom: 48px; }
.grocery-intro { font-size: 13px; color: var(--ink-light); margin-bottom: 20px; }
.grocery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.grocery-cat { background: white; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.grocery-cat-header { padding: 11px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.grocery-cat-icon { font-size: 16px; }
.grocery-cat-name { font-size: 13px; font-weight: 500; color: var(--ink); }
.grocery-cat-count { font-size: 11px; color: var(--ink-faint); margin-left: auto; }
.grocery-items { padding: 6px 0; }
.grocery-item { display: flex; align-items: flex-start; gap: 10px; padding: 7px 16px; cursor: pointer; transition: background 0.1s; }
.grocery-item:hover { background: var(--cream); }
.grocery-item.checked { opacity: 0.45; }
.grocery-item.checked .gi-name { text-decoration: line-through; }
.gi-check { width: 16px; height: 16px; border: 1.5px solid var(--border-strong); border-radius: 3px; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.grocery-item.checked .gi-check { background: var(--green); border-color: var(--green); }
.gi-check svg { width: 9px; height: 9px; stroke: white; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity 0.15s; }
.grocery-item.checked .gi-check svg { opacity: 1; }
.gi-name { font-size: 13px; color: var(--ink); line-height: 1.4; }
.gi-qty { font-size: 11px; color: var(--ink-faint); }

/* PRINT / RESET */
.actions { display: flex; gap: 10px; margin-bottom: 32px; }
.action-btn { padding: 8px 18px; font-size: 13px; font-family: 'DM Sans', sans-serif; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; cursor: pointer; color: var(--ink-light); }
.action-btn:hover { border-color: var(--border-strong); color: var(--ink); }
.action-btn.primary { background: var(--green); color: white; border-color: var(--green); }
.action-btn.primary:hover { background: #1f5e43; }

@media (max-width: 600px) {
  .week-strip { grid-template-columns: repeat(4, 1fr); }
  .recipe-body { grid-template-columns: 1fr; }
  .recipe-ingredients { border-right: none; border-bottom: 1px solid var(--border); }
  .grocery-grid { grid-template-columns: 1fr; }
}
@media print {
  @page { margin: 0.5in; size: letter; }
  .actions { display: none; }
  header { margin-bottom: 12px; padding: 8px 0; }
  body { padding-bottom: 0; font-size: 11px; max-width: 100%; }
  .grocery-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 8px; }
  .grocery-section { margin-bottom: 16px; }
  .grocery-cat { border: 0.5px solid #ccc; border-radius: 4px; break-inside: avoid; }
  .grocery-cat-header { padding: 6px 10px; }
  .grocery-cat-name { font-size: 11px; }
  .grocery-item { padding: 3px 10px; }
  .gi-name { font-size: 11px; line-height: 1.3; }
  .gi-check { width: 11px; height: 11px; border: 1px solid #999; border-radius: 2px; flex-shrink: 0; }
  .gi-check svg { display: none; }
  .grocery-intro { font-size: 11px; margin-bottom: 8px; }
  .week-strip { gap: 4px; margin-bottom: 12px; }
  .day-block { padding: 5px 4px; }
  .day-block .day-emoji { font-size: 14px; }
  .day-block .day-meal { font-size: 9px; }
  .section-title { font-size: 14px; margin-bottom: 8px; padding-bottom: 6px; }
  .recipe-card { break-inside: avoid; margin-bottom: 8px; }
  .recipe-name { font-size: 13px; }
  .recipe-header { padding: 10px 14px; }
  .ing-list li, .inst-list li { font-size: 11px; padding: 2px 0; }
  .inst-list li { padding-left: 20px; }
  .prep-note { font-size: 10px; padding: 6px 14px; }
  .recipes-grid { gap: 10px; margin-bottom: 16px; }
}
</style>

<header>
  <div class="logo"><div class="logo-dot"></div> Dinner Buddy</div>
  <div class="meta" id="header-meta"></div>
</header>

<div id="app"></div>

<script>
const DAYS_ORDER = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function buildPage() {
  document.getElementById('header-meta').innerHTML = `${PLAN.week}<br>${PLAN.family}`;

  const meals = DAYS_ORDER.map(d => ({ day: d, meal: PLAN.schedule[d] })).filter(x => x.meal);
  const app = document.getElementById('app');

  // ── WEEK STRIP ──
  const strip = document.createElement('div');
  strip.className = 'week-strip';
  meals.forEach(({ day, meal }) => {
    const db = MEAL_DB[meal] || {};
    const shortName = meal.split(' ').slice(0, 3).join(' ');
    strip.innerHTML += `
      <div class="day-block">
        <div class="day-name">${day}</div>
        <div class="day-emoji">${db.emoji || '🍽'}</div>
        <div class="day-meal">${shortName}</div>
      </div>`;
  });
  app.appendChild(strip);

  // ── ACTIONS ──
  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.innerHTML = `
    <button class="action-btn primary" onclick="window.print()">Print / Save PDF</button>
    <button class="action-btn" onclick="resetChecks()">Reset grocery checks</button>`;
  app.appendChild(actions);

  // ── GROCERY LIST (first) ──
  const groceryTitle = document.createElement('h2');
  groceryTitle.className = 'section-title';
  groceryTitle.innerHTML = 'Consolidated <em>grocery list</em>';
  app.appendChild(groceryTitle);

  const groceryIntro = document.createElement('p');
  groceryIntro.className = 'grocery-intro';
  groceryIntro.textContent = `Everything you need for all 7 meals · ${PLAN.family} · Check off items you already have`;
  app.appendChild(groceryIntro);

  // merge all grocery contributions
  const merged = {};
  meals.forEach(({ meal }) => {
    const db = MEAL_DB[meal];
    if (!db || !db.groceryContributions) return;
    Object.entries(db.groceryContributions).forEach(([cat, items]) => {
      if (!merged[cat]) merged[cat] = new Set();
      items.forEach(item => merged[cat].add(item));
    });
  });

  const grocerySection = document.createElement('div');
  grocerySection.className = 'grocery-section';
  const groceryGrid = document.createElement('div');
  groceryGrid.className = 'grocery-grid';

  const sortedCats = Object.keys(merged).sort((a, b) => {
    const oa = CAT_META[a] ? CAT_META[a].order : 99;
    const ob = CAT_META[b] ? CAT_META[b].order : 99;
    return oa - ob;
  });

  sortedCats.forEach(cat => {
    const items = [...merged[cat]];
    const meta = CAT_META[cat] || { icon: '📦' };
    const catDiv = document.createElement('div');
    catDiv.className = 'grocery-cat';
    catDiv.innerHTML = `
      <div class="grocery-cat-header">
        <span class="grocery-cat-icon">${meta.icon}</span>
        <span class="grocery-cat-name">${cat}</span>
        <span class="grocery-cat-count">${items.length} items</span>
      </div>
      <div class="grocery-items">
        ${items.map((item, i) => `
          <div class="grocery-item" onclick="toggleCheck(this)" data-id="${cat}-${i}">
            <div class="gi-check">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <span class="gi-name">${item}</span>
          </div>`).join('')}
      </div>`;
    groceryGrid.appendChild(catDiv);
  });

  grocerySection.appendChild(groceryGrid);
  app.appendChild(grocerySection);

  // ── RECIPES (after grocery list) ──
  const recipeTitle = document.createElement('h2');
  recipeTitle.className = 'section-title';
  recipeTitle.innerHTML = 'This week\'s <em>recipes</em>';
  app.appendChild(recipeTitle);

  const recipesGrid = document.createElement('div');
  recipesGrid.className = 'recipes-grid';

  meals.forEach(({ day, meal }) => {
    const db = MEAL_DB[meal];
    if (!db) return;
    const card = document.createElement('div');
    card.className = 'recipe-card';
    card.innerHTML = `
      <div class="recipe-header">
        <div class="recipe-emoji">${db.emoji}</div>
        <div class="recipe-title-block">
          <div class="recipe-name">${meal}</div>
          <span class="recipe-day-badge">${day}</span>
          <div class="recipe-tags">
            <span class="rtag">${db.time} min</span>
            <span class="rtag">${db.skill}</span>
            <span class="rtag">Sides: ${db.sides}</span>
          </div>
        </div>
      </div>
      <div class="recipe-body">
        <div class="recipe-ingredients">
          <div class="col-label">Ingredients</div>
          <ul class="ing-list">
            ${db.ingredients.map(i => `<li>${i}</li>`).join('')}
          </ul>
        </div>
        <div class="recipe-instructions">
          <div class="col-label">Instructions</div>
          <ol class="inst-list">
            ${db.instructions.map(s => `<li>${s}</li>`).join('')}
          </ol>
        </div>
      </div>
      <div class="prep-note">Prep tip: ${db.prepNote}</div>`;
    recipesGrid.appendChild(card);
  });
  app.appendChild(recipesGrid);

  loadChecks();
}

function toggleCheck(el) {
  el.classList.toggle('checked');
  saveChecks();
}

function saveChecks() {
  const checked = [...document.querySelectorAll('.grocery-item.checked')].map(el => el.dataset.id);
  try { localStorage.setItem('db-checks-' + PLAN.week, JSON.stringify(checked)); } catch(e) {}
}

function loadChecks() {
  try {
    const saved = JSON.parse(localStorage.getItem('db-checks-' + PLAN.week) || '[]');
    saved.forEach(id => {
      const el = document.querySelector(`[data-id="${id}"]`);
      if (el) el.classList.add('checked');
    });
  } catch(e) {}
}

function resetChecks() {
  document.querySelectorAll('.grocery-item.checked').forEach(el => el.classList.remove('checked'));
  try { localStorage.removeItem('db-checks-' + PLAN.week); } catch(e) {}
}

buildPage();
</script>
</body>
</html>
